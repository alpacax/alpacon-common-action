name: Test Alpacon Common Action

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-basic-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Server List Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'server ls'

      - name: Test Exec List Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'exec ls --tail=3'

  test-complex-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Note Creation Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'websh ${{ secrets.TEST_SERVER_NAME }} whoami'

      - name: Test Quoted Argument Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'websh ${{ secrets.TEST_SERVER_NAME }} "echo hello world"'

      - name: Test Escaped Space Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'websh ${{ secrets.TEST_SERVER_NAME }} echo\ hello'

      - name: Test Help Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: '--help'

  test-error-handling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Invalid Command (should fail gracefully)
        continue-on-error: true
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'invalid-command --nonexistent-flag'

      - name: Test Unbalanced Quote Command (should fail)
        id: unbalanced-quote
        continue-on-error: true
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: 'websh "unbalanced'

      - name: Assert unbalanced quote command failed
        if: steps.unbalanced-quote.outcome != 'failure'
        run: |
          echo "Expected the unbalanced quote command to fail, got: ${{ steps.unbalanced-quote.outcome }}"
          exit 1

      - name: Test Whitespace-Only Command (should fail)
        id: empty-command
        continue-on-error: true
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          command: '   '

      - name: Assert whitespace-only command failed
        if: steps.empty-command.outcome != 'failure'
        run: |
          echo "Expected the whitespace-only command to fail, got: ${{ steps.empty-command.outcome }}"
          exit 1
